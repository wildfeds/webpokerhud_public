name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'examples/hands_jsonl_objs/**'
      - 'src/panel/stat_info.ts'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'examples/hands_jsonl_objs/**'
      - 'src/panel/stat_info.ts'
      - '.github/workflows/website.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:schema
      # prebuild regenerates the stat glossary from the extension source;
      # the diff check catches a committed stats.md that has drifted.
      - run: npm run build
      - run: git diff --exit-code src/content/docs/stats.md
